[package]
name = "bu2agent-shell"
version = "0.1.0"
description = "Tauri 2 shell for the bu2agent client"
edition = "2021"

# Tauri 壳保持独立 workspace，避免被上层业务 workspace 误收编。
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent-desktop = { path = "../../desktop" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# This crate is deliberately NOT a member of the workspace rooted
# at the project root (which covers apps/desktop and
# services/mock-gateway). The empty [workspace] table marks it
# as its own workspace root, so cargo stops walking up and no
# longer complains that it "believes it's in a workspace when
# it's not" when `cargo tauri dev` runs `cargo metadata` here.
