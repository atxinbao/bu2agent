[package]
name = "mock-gateway"
version = "0.1.0"
edition = "2021"
description = "Mock Gateway state machine (chat first). Pure logic, no HTTP server yet: the Axum transport that serves it lands after the state machine is tested."

[lib]
name = "mock_gateway"
path = "src/lib.rs"

[dependencies]
agent-desktop = { path = "../../apps/desktop" }
axum = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

# EventKit backend: macOS only. Other platforms (including CI's
# ubuntu/windows jobs) compile without it; the gateway keeps the
# Fake backend there.
[target.'cfg(target_os = "macos")'.dependencies]
eventkit = "0.4"

# The build script queries the Swift toolchain for its runtime
# library paths (macOS only). serde_json is already a main
# dependency, so this adds no new package to the lockfile.
[build-dependencies]
serde_json = "1"
