[package]
name = "mock-gateway"
version = "0.1.0"
edition = "2021"
description = "Mock Gateway state machine (chat first). Pure logic, no HTTP server yet: the Axum transport that serves it lands after the state machine is tested."

[lib]
name = "mock_gateway"
path = "src/lib.rs"

[dependencies]
agent-desktop = { path = "../../apps/desktop" }
axum = "0.8"
base64 = "0.22"
dunce = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# P0-D: SQLite persistence for the unified plane (executions /
# effects / approvals + events + Inbox / Outbox). Sync API matches
# the existing sync Mutex store model; `bundled` compiles SQLite
# in-tree so no platform needs a system SQLite dev package.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# EventKit backend: macOS only. Other platforms (including CI's
# ubuntu/windows jobs) compile without it; the gateway keeps the
# Fake backend there.
[target.'cfg(target_os = "macos")'.dependencies]
eventkit = "0.4"
# MCL-3: Core Location binding, macOS only (same gate as
# EventKit). The gateway sidecar runs inside the signed
# .app bundle, so the in-process binding requests
# authorization as com.bu2ai.bu2agent — the packaged-app
# identity Q-MCL-15 requires. No helper subprocess: a
# helper would be a second executable with its own TCC
# attribution question, and the MCL-0 S2 evidence covers
# a standalone Swift app, not a helper. objc2 0.3.x is
# the binding family the MCL-0 probe verified exists
# (0.3.2 on crates.io). The macOS body cannot be
# compiled on this VM at all (objc2 hard-errors on
# non-Apple targets, eventkit's build script needs
# macOS): CI's macOS job is the only compile check,
# like eventkit.
objc2-core-location = "0.3.2"
# MCL-3: the binding's companions — `define_class!` /
# `ProtocolObject` (objc2) and `NSRunLoop` / `NSDate` /
# `NSError` / `NSArray` (objc2-foundation) for the
# one-shot delegate + runloop pump in location_source.rs.
objc2 = "0.6"
objc2-foundation = "0.3"

# The build script queries the Swift toolchain for its runtime
# library paths (macOS only). serde_json is already a main
# dependency, so this adds no new package to the lockfile.
[build-dependencies]
serde_json = "1"
